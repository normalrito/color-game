<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신나는 색깔놀이</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="titleScreen" class="title-screen" aria-label="시작 화면">
      <div class="title-colors" aria-hidden="true">
        <span style="--swatch: #e53935"></span>
        <span style="--swatch: #fdd835"></span>
        <span style="--swatch: #1e88e5"></span>
        <span style="--swatch: #43a047"></span>
      </div>
      <h1>신나는 색깔놀이</h1>
      <button id="startButton" class="start-button" type="button">시작하기</button>
      <p class="version">v1.2.4</p>
    </section>

    <section id="menuScreen" class="title-screen menu-screen" aria-label="게임 선택 화면" hidden>
      <h1>게임을 골라요</h1>
      <div class="game-menu" aria-label="게임 선택">
        <button class="game-select" type="button" data-game="matchOne">같은 색깔 찾기</button>
        <button class="game-select" type="button" data-game="findAll">같은 색 모두 찾기</button>
        <button class="game-select" type="button" data-game="tapCount">숫자만큼 누르기</button>
        <button class="game-select" type="button" data-game="mixColors">색 섞기 퀴즈</button>
      </div>
    </section>

    <main id="gameScreen" class="app" aria-live="polite" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">신나는 색깔놀이</p>
          <h1 id="gameTitle">같은 색깔 찾기</h1>
        </div>
        <div class="score" aria-label="현재 맞힌 개수">
          <span id="score">0</span>
          <span>개</span>
        </div>
        <button id="soundToggle" class="tool-button is-sound-on" type="button" aria-label="소리 켜짐" aria-pressed="true">
          <svg class="sound-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9H4z" />
            <path class="sound-wave" d="M16 8.5a5 5 0 0 1 0 7" />
            <path class="sound-wave" d="M18.5 6a8.5 8.5 0 0 1 0 12" />
            <path class="mute-slash" d="M3 3l18 18" />
          </svg>
        </button>
        <button id="resetButton" class="tool-button" type="button" aria-label="처음부터">
          <svg class="tool-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 4v6h6" />
          </svg>
        </button>
      </header>

      <section class="stage" aria-labelledby="prompt">
        <div class="target-wrap">
          <p id="prompt" class="prompt">같은 색깔을 찾아요</p>
          <div id="targetCard" class="target-card" aria-label="찾아야 할 색깔">
            <div id="mixLayer" class="mix-layer" hidden>
              <div id="mixColorA" class="mix-color mix-color-a"></div>
              <div id="mixColorB" class="mix-color mix-color-b"></div>
              <div id="mixResult" class="mix-result"></div>
            </div>
            <span id="targetCount" class="target-count" hidden></span>
          </div>
          <p id="targetName" class="target-name">빨간색</p>
        </div>

        <div id="choices" class="choices" role="group" aria-label="색깔 선택"></div>
      </section>

      <section class="controls" aria-label="게임 설정">
        <button id="levelDown" class="icon-button" type="button" aria-label="선택지 줄이기">
          -
        </button>
        <div class="level">
          <span>선택지</span>
          <strong id="levelLabel">2개</strong>
        </div>
        <button id="levelUp" class="icon-button" type="button" aria-label="선택지 늘리기">
          +
        </button>
        <button id="nextButton" class="text-button" type="button" aria-label="다음 문제">
          <span class="button-icon" aria-hidden="true">▶</span>
          <span class="button-label">다음 문제</span>
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
